[package]
name = "robot-vacuum-firmware"
version = "0.1.0"
edition = "2021"
description = "Trait-driven robot vacuum firmware simulator with an axum HTTP API"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
